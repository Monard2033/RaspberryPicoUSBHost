# Project-local workaround for mismatched OpenOCD 0.12.0+dev scripts/binary.
# The bundled target/rp2040.cfg passes an obsolete flash-bank argument:
#     rp2xxx rom_api_call 0 CX
# Current rp2xxx syntax expects the two-character ROM function code first.

source [find target/rp2040.cfg]

rp2040.core0 configure -event reset-init {
	rp2xxx rom_api_call CX
}
