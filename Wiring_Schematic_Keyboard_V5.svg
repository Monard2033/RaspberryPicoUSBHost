<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1500" viewBox="0 0 2200 1500" style="background-color: #ffffff;">
  <defs>
    <style>
      .title { font: 700 42px "Segoe UI", Arial, sans-serif; fill: #0f172a; letter-spacing: 1px; }
      .h { font: 700 24px "Segoe UI", Arial, sans-serif; fill: #1e293b; }
      .t { font: 18px "Segoe UI", Arial, sans-serif; fill: #334155; }
      .pin-dark { font: 700 16px Consolas, monospace; fill: #f8fafc; }
      .pin-light { font: 700 16px Consolas, monospace; fill: #0f172a; }
      
      .box { fill: #f8fafc; stroke: #475569; stroke-width: 4; rx: 12px; }
      .mcu { fill: #1e293b; stroke: #0f172a; stroke-width: 5; rx: 16px; }
      .power { fill: #ecfdf5; stroke: #059669; stroke-width: 4; rx: 12px; }
      .dongle { fill: #f1f5f9; stroke: #64748b; stroke-width: 4; stroke-dasharray: 12 8; rx: 12px; }
      
      .wire { fill: none; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .wire-thin { fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      
      .pad-dark { fill: #334155; stroke: #94a3b8; stroke-width: 3; }
      .pad-light { fill: #ffffff; stroke: #475569; stroke-width: 3; }
      .junction { fill: #0f172a; }
      
      .nc { stroke: #ef4444; stroke-width: 6; stroke-linecap: round; }
      .tag { font: 700 16px "Segoe UI", Arial, sans-serif; }
      .legend-title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .legend-text { font: 18px "Segoe UI", Arial, sans-serif; fill: #1e293b; }
    </style>
  </defs>

  <text x="1100" y="70" text-anchor="middle" class="title">WIRELESS KEYBOARD WIRING SCHEMATIC — RP2040 + nRF52840</text>
  <text x="1100" y="110" text-anchor="middle" class="t">Ergonomic Clean Layout — SPI0 on Right Side (GP16-19), RGB LED on Left Side (GP7-9)</text>

  <!-- BATTERY -->
  <rect x="50" y="250" width="160" height="280" class="box"/>
  <text x="130" y="300" text-anchor="middle" class="h">BATTERY</text>
  <text x="130" y="330" text-anchor="middle" class="t">Li-ion / LiPo 1S</text>
  <text x="130" y="355" text-anchor="middle" class="t">3.0–4.2 V</text>
  <circle cx="210" cy="400" r="8" class="pad-light"/><text x="155" y="405" class="pin-light">BAT+</text>
  <circle cx="210" cy="480" r="8" class="pad-light"/><text x="155" y="485" class="pin-light">BAT−</text>
  
  <!-- J5019 -->
  <rect x="350" y="250" width="220" height="280" class="power"/>
  <text x="460" y="295" text-anchor="middle" class="h">J5019</text>
  <text x="460" y="325" text-anchor="middle" class="t">Boost Regulator</text>
  <rect x="415" y="470" width="90" height="40" rx="6" fill="#059669"/><text x="460" y="497" text-anchor="middle" font-family="Arial" font-size="17" fill="white" font-weight="bold">USB-C</text>
  
  <circle cx="350" cy="400" r="8" class="pad-light"/><text x="365" y="405" class="pin-light">BAT+</text>
  <circle cx="350" cy="480" r="8" class="pad-light"/><text x="365" y="485" class="pin-light">BAT−</text>
  <circle cx="570" cy="400" r="8" class="pad-light"/><text x="505" y="405" class="pin-light">VOUT+</text>
  <circle cx="570" cy="480" r="8" class="pad-light"/><text x="505" y="485" class="pin-light">VOUT−</text>

  <!-- SPST SWITCH -->
  <rect x="660" y="200" width="140" height="70" class="box"/>
  <text x="730" y="225" text-anchor="middle" class="h">SPST</text>
  <line x1="680" y1="250" x2="710" y2="250" stroke="#111" stroke-width="5" stroke-linecap="round"/>
  <line x1="750" y1="250" x2="780" y2="250" stroke="#111" stroke-width="5" stroke-linecap="round"/>
  <line x1="710" y1="250" x2="750" y2="230" stroke="#111" stroke-width="5" stroke-linecap="round"/>

  <!-- WeAct Studio RP2040 -->
  <rect x="850" y="320" width="280" height="660" class="mcu"/>
  <text x="990" y="360" text-anchor="middle" class="h" fill="#fbbf24">WeAct Studio RP2040</text>
  
  <!-- RP2040 Left Pins (Top to Bottom) -->
  <circle cx="850" cy="455" r="8" class="pad-dark"/><text x="870" y="460" class="pin-dark">GP4 (Pin 6)</text>
  <circle cx="850" cy="500" r="8" class="pad-dark"/><text x="870" y="505" class="pin-dark">GP5 (Pin 7)</text>
  <circle cx="850" cy="545" r="8" class="pad-dark"/><text x="870" y="550" class="pin-dark">GND (Pin 8)</text>
  
  <circle cx="850" cy="635" r="8" class="pad-dark"/><text x="870" y="640" class="pin-dark">GP7 (Pin 10)</text>
  <circle cx="850" cy="680" r="8" class="pad-dark"/><text x="870" y="685" class="pin-dark">GP8 (Pin 11)</text>
  <circle cx="850" cy="725" r="8" class="pad-dark"/><text x="870" y="730" class="pin-dark">GP9 (Pin 12)</text>
  <circle cx="850" cy="770" r="8" class="pad-dark"/><text x="870" y="775" class="pin-dark">GND (Pin 13)</text>

  <!-- RP2040 Right Pins (Top to Bottom) -->
  <circle cx="1130" cy="410" r="8" class="pad-dark"/><text x="1015" y="415" class="pin-dark">VSYS (Pin 39)</text>
  <circle cx="1130" cy="455" r="8" class="pad-dark"/><text x="1025" y="460" class="pin-dark">GND (Pin 38)</text>
  <circle cx="1130" cy="500" r="8" class="pad-dark"/><text x="1025" y="505" class="pin-dark">3V3 (Pin 37)</text>
  <circle cx="1130" cy="580" r="8" class="pad-dark"/><text x="965" y="585" class="pin-dark">GP28/ADC2 (Pin 34)</text>

  <circle cx="1130" cy="680" r="8" class="pad-dark"/><text x="975" y="685" class="pin-dark">GP19/MOSI (Pin 25)</text>
  <circle cx="1130" cy="725" r="8" class="pad-dark"/><text x="985" y="730" class="pin-dark">GP18/SCK (Pin 24)</text>
  <circle cx="1130" cy="770" r="8" class="pad-dark"/><text x="985" y="775" class="pin-dark">GP17/CSN (Pin 22)</text>
  <circle cx="1130" cy="815" r="8" class="pad-dark"/><text x="980" y="820" class="pin-dark">GP16/MISO (Pin 21)</text>

  <!-- USB Keyboard Port (Placed Left) -->
  <rect x="550" y="420" width="180" height="200" class="box"/>
  <text x="640" y="455" text-anchor="middle" class="h">USB KEYBOARD</text>
  <text x="640" y="480" text-anchor="middle" class="t">Host Port (D+/D-)</text>
  
  <circle cx="730" cy="500" r="8" class="pad-light"/><text x="690" y="505" class="pin-light">D+</text>
  <circle cx="730" cy="545" r="8" class="pad-light"/><text x="690" y="550" class="pin-light">D−</text>
  <circle cx="550" cy="500" r="8" class="pad-light"/><text x="565" y="505" class="pin-light">5V</text>
  <circle cx="550" cy="545" r="8" class="pad-light"/><text x="565" y="550" class="pin-light">GND</text>

  <!-- RGB LED (Placed Left, under USB) -->
  <rect x="550" y="680" width="200" height="220" class="box"/>
  <text x="650" y="715" text-anchor="middle" class="h">RGB LED</text>
  <text x="650" y="740" text-anchor="middle" class="t">(Common Cathode)</text>
  
  <circle cx="750" cy="770" r="8" class="pad-light"/><text x="720" y="775" class="pin-light">R</text>
  <circle cx="750" cy="810" r="8" class="pad-light"/><text x="720" y="815" class="pin-light">G</text>
  <circle cx="750" cy="850" r="8" class="pad-light"/><text x="720" y="855" class="pin-light">B</text>
  <circle cx="750" cy="885" r="8" class="pad-light"/><text x="680" y="890" class="pin-light">C (GND)</text>

  <!-- ProMicro nRF52840 Transmitter (Placed Right) -->
  <rect x="1480" y="420" width="240" height="460" class="mcu"/>
  <text x="1600" y="460" text-anchor="middle" class="h" fill="#fbbf24">Nice!Nano nRF52840</text>
  <text x="1600" y="485" text-anchor="middle" class="t" fill="#94a3b8">Transmitter (SPI0)</text>
  
  <circle cx="1480" cy="500" r="8" class="pad-dark"/><text x="1500" y="505" class="pin-dark">VCC / 3V3</text>
  <circle cx="1480" cy="545" r="8" class="pad-dark"/><text x="1500" y="550" class="pin-dark">GND</text>
  <circle cx="1480" cy="680" r="8" class="pad-dark"/><text x="1500" y="685" class="pin-dark">P0.20 - MOSI</text>
  <circle cx="1480" cy="725" r="8" class="pad-dark"/><text x="1500" y="730" class="pin-dark">P0.17 - SCK</text>
  <circle cx="1480" cy="770" r="8" class="pad-dark"/><text x="1500" y="775" class="pin-dark">P0.22 - CSN</text>
  <circle cx="1480" cy="815" r="8" class="pad-dark"/><text x="1500" y="820" class="pin-dark">P0.08 - MISO</text>

  <!-- Dongle -->
  <rect x="1850" y="460" width="160" height="160" class="dongle"/>
  <text x="1930" y="500" text-anchor="middle" class="h">DONGLE</text>
  <text x="1930" y="530" text-anchor="middle" class="t">nRF52840</text>
  <rect x="1895" y="550" width="70" height="40" rx="4" fill="#334155"/>

  <!-- ==================== WIRING ==================== -->
  
  <!-- Common Ground Bus -->
  <line x1="100" y1="1130" x2="2100" y2="1130" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
  <text x="1100" y="1165" text-anchor="middle" class="tag" fill="#0f172a">BLACK — COMMON GROUND (GND) — 0V</text>

  <path d="M210 480 V1130" class="wire" stroke="#0f172a"/> <circle cx="210" cy="1130" r="10" class="junction"/>
  <path d="M350 480 V1130" class="wire" stroke="#0f172a"/> <circle cx="350" cy="1130" r="10" class="junction"/>
  <path d="M570 480 V1130" class="wire" stroke="#0f172a"/> <circle cx="570" cy="1130" r="10" class="junction"/>
  <path d="M850 545 H810 V1130" class="wire" stroke="#0f172a"/> <circle cx="810" cy="1130" r="10" class="junction"/>
  <path d="M850 770 H810" class="wire" stroke="#0f172a"/>
  <path d="M1130 455 H1170 V1130" class="wire" stroke="#0f172a"/> <circle cx="1170" cy="1130" r="10" class="junction"/>
  <path d="M1480 545 H1440 V1130" class="wire" stroke="#0f172a"/> <circle cx="1440" cy="1130" r="10" class="junction"/>
  <path d="M550 545 H520 V1130" class="wire" stroke="#0f172a"/> <circle cx="520" cy="1130" r="10" class="junction"/>

  <!-- Battery & Boost Power -->
  <path d="M210 400 H350" class="wire" stroke="#ef4444"/>
  <text x="245" y="385" class="tag" fill="#ef4444">BAT+</text>

  <path d="M570 400 V235 H660" class="wire" stroke="#ef4444"/>
  <text x="585" y="380" class="tag" fill="#ef4444">VOUT+ (5.0V)</text>

  <!-- Switched +5V Power to RP2040 and USB Keyboard -->
  <path d="M800 235 H1130 V410" class="wire" stroke="#ef4444"/>
  <path d="M800 235 H520 V500 H550" class="wire" stroke="#ef4444"/>
  <circle cx="800" cy="235" r="8" fill="#ef4444"/>
  <text x="965" y="220" class="tag" fill="#ef4444">SWITCHED +5 V (System Power)</text>

  <!-- 3V3 Power to nRF52840 Transmitter -->
  <path d="M1130 500 H1480" class="wire" stroke="#000000" stroke-width="12"/>
  <path d="M1130 500 H1480" class="wire" stroke="#ffffff" stroke-width="6"/>
  <text x="1305" y="490" text-anchor="middle" class="tag" fill="#000000">WHITE — 3V3(OUT) to Nice!Nano VCC</text>

  <!-- USB Host Signals (Left side - GP4/GP5 direct to Port) -->
  <path d="M850 455 H780 V500 H730" class="wire" stroke="#8b5a2b"/>
  <text x="790" y="445" class="tag" fill="#8b5a2b">BROWN: GP4 → D+</text>

  <path d="M850 500 H760 V545 H730" class="wire" stroke="#64748b"/>
  <text x="790" y="535" class="tag" fill="#64748b">GRAY: GP5 → D−</text>

  <!-- Left Side: Clean RGB LED Connections (GP7, GP8, GP9) with 220 Ohm Resistors -->
  <path d="M850 635 H800" class="wire" stroke="#ef4444"/>
  <polyline points="800,635 790,620 770,650 750,620 730,650 720,635 680,635" class="wire-thin" stroke="#ef4444"/>
  <path d="M680 635 V770 H750" class="wire" stroke="#ef4444"/>
  <text x="760" y="620" class="tag" fill="#ef4444">GP7 → R (220Ω)</text>

  <path d="M850 680 H800" class="wire" stroke="#22c55e"/>
  <polyline points="800,680 790,665 770,695 750,665 730,695 720,680 660,680" class="wire-thin" stroke="#22c55e"/>
  <path d="M660 680 V810 H750" class="wire" stroke="#22c55e"/>
  <text x="760" y="665" class="tag" fill="#22c55e">GP8 → G (220Ω)</text>

  <path d="M850 725 H800" class="wire" stroke="#3b82f6"/>
  <polyline points="800,725 790,710 770,740 750,710 730,740 720,725 640,725" class="wire-thin" stroke="#3b82f6"/>
  <path d="M640 725 V850 H750" class="wire" stroke="#3b82f6"/>
  <text x="760" y="710" class="tag" fill="#3b82f6">GP9 → B (220Ω)</text>

  <path d="M750 885 H600 V1130" class="wire" stroke="#0f172a"/> <circle cx="600" cy="1130" r="10" class="junction"/>

  <!-- Right Side: 100% PARALLEL SPI0 HARDWARE BUS (GP16, GP17, GP18, GP19) -->
  <path d="M1130 680 H1480" class="wire" stroke="#3b82f6"/> 
  <text x="1305" y="670" text-anchor="middle" class="tag" fill="#3b82f6">BLUE: GP19 (MOSI) ──→ P0.20 (MOSI)</text>

  <path d="M1130 725 H1480" class="wire" stroke="#eab308"/> 
  <text x="1305" y="715" text-anchor="middle" class="tag" fill="#eab308">YELLOW: GP18 (SCK) ──→ P0.17 (SCK)</text>

  <path d="M1130 770 H1480" class="wire" stroke="#22c55e"/> 
  <text x="1305" y="760" text-anchor="middle" class="tag" fill="#22c55e">GREEN: GP17 (CSN) ──→ P0.22 (CSN)</text>

  <path d="M1130 815 H1480" class="wire" stroke="#a855f7"/> 
  <text x="1305" y="805" text-anchor="middle" class="tag" fill="#a855f7">PURPLE: GP16 (MISO) ──→ P0.08 (MISO)</text>

  <!-- ADC DIVIDER NETWORK (Right Side - GP28) -->
  <path d="M280 400 V950 H1200 V580 H1130" class="wire-thin" stroke="#f97316"/>
  <circle cx="280" cy="400" r="6" fill="#f97316"/>
  <text x="1150" y="570" class="tag" fill="#f97316">ORANGE: ADC_NODE → GP28</text>

  <!-- ==================== LEGEND & NOTES ==================== -->
  <rect x="50" y="1220" width="2100" height="270" class="box" fill="#f8fafc" stroke="#334155"/>
  <text x="80" y="1265" class="legend-title">LEGEND &amp; ASSEMBLY NOTES</text>
  
  <line x1="80" y1="1285" x2="2110" y2="1285" stroke="#cbd5e1" stroke-width="3"/>

  <g class="legend-text">
    <text x="80" y="1315">
      <tspan font-weight="bold" fill="#c2410c">1. HARDWARE SPI0 (RIGHT SIDE):</tspan> Pins GP16 (MISO), GP17 (CSN), GP18 (SCK), GP19 (MOSI)
      <tspan x="80" dy="22">connect directly to Nice!Nano with 100% parallel lines. Zero wire crossing!</tspan>
    </text>
    <text x="80" y="1365">
      <tspan font-weight="bold">2. RGB LED (LEFT SIDE):</tspan> GP7 (Red), GP8 (Green), GP9 (Blue) with GND at Pin 13
      <tspan x="80" dy="22">form a 4-pin contiguous header block. Use 220Ω-330Ω current limiting resistors.</tspan>
    </text>
    <text x="80" y="1415">
      <tspan font-weight="bold" fill="#dc2626">3. USB KEYBOARD HOST:</tspan> GP4 (D+ Brown) and GP5 (D- Gray) wire directly to the physical port.
      <tspan x="80" dy="22">Power is delivered via the 5V switched system bus.</tspan>
    </text>
  </g>

  <line x1="1200" y1="1285" x2="1200" y2="1470" stroke="#cbd5e1" stroke-width="3"/>
  <g class="legend-text">
    <text x="1230" y="1315" font-weight="bold">RECOMMENDED WIRE COLOR CODE:</text>
    <text x="1230" y="1355"><tspan fill="#ef4444" font-weight="bold">RED:</tspan> Switched +5V Power</text>
    <text x="1560" y="1355"><tspan fill="#0f172a" font-weight="bold">BLACK:</tspan> Ground (GND, 0V)</text>
    <text x="1850" y="1355"><tspan fill="#475569" font-weight="bold">WHITE:</tspan> 3V3 VCC to Nice!Nano</text>

    <text x="1230" y="1395"><tspan fill="#f97316" font-weight="bold">ORANGE:</tspan> Battery ADC Sense (GP28)</text>
    <text x="1560" y="1395"><tspan fill="#8b5a2b" font-weight="bold">BROWN / GRAY:</tspan> USB Host D+ (GP4) / D- (GP5)</text>

    <text x="1230" y="1435"><tspan fill="#3b82f6" font-weight="bold">BLUE:</tspan> MOSI (GP19)</text>
    <text x="1430" y="1435"><tspan fill="#eab308" font-weight="bold">YELLOW:</tspan> SCK (GP18)</text>
    <text x="1630" y="1435"><tspan fill="#22c55e" font-weight="bold">GREEN:</tspan> CSN (GP17)</text>
    <text x="1830" y="1435"><tspan fill="#a855f7" font-weight="bold">PURPLE:</tspan> MISO (GP16)</text>
  </g>
</svg>
